name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Attest & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.24.x"

      - name: Run test suite
        run: go test -v ./...

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/corechat ./cmd/corechat

      - name: Generate CycloneDX SBOM
        run: |
          node -e '
            const fs = require("fs");
            const sbom = {
              bomFormat: "CycloneDX",
              specVersion: "1.5",
              version: 1,
              metadata: {
                timestamp: new Date().toISOString(),
                component: {
                  name: "corechat",
                  version: "${{ github.ref_name }}".replace(/^v/, ""),
                  type: "application",
                  description: "CoreBlow terminal chat client and Go SDK"
                }
              },
              components: []
            };
            fs.writeFileSync("sbom.cdx.json", JSON.stringify(sbom, null, 2));
          '

      - name: Generate SHA256 Checksums
        run: |
          sha256sum bin/corechat sbom.cdx.json > SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1a5fb4a4820409d77786ac42e1161725 # v2.2.3
        with:
          subject-path: |
            bin/corechat
            sbom.cdx.json
            SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            bin/corechat
            sbom.cdx.json
            SHA256SUMS.txt
          generate_release_notes: true
